# Render Blueprint - Solar Quotation App
# https://docs.render.com/blueprint-spec

services:
  # ─── Backend (Express + TypeScript) ───────────────────────────────────────
  # rootDir is set to apps/backend so all npm commands run inside that folder.
  # npm install picks up .npmrc (include=dev) which forces devDependencies to
  # be installed even though Render sets NODE_ENV=production during the build.
  # This ensures TypeScript 5.6.3 (devDep) is available for `tsc`.
  # prisma migrate deploy applies all pending DB migrations on every deployment.
  - type: web
    name: solar-quotation-backend
    runtime: node
    rootDir: apps/backend

    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: "production"
      # Set these in the Render dashboard (secrets):
      # - key: DATABASE_URL
      #   sync: false
      # - key: JWT_SECRET
      #   sync: false

  # ─── Frontend (Next.js) ───────────────────────────────────────────────────
  - type: web
    name: solar-quotation-frontend
    runtime: node
    rootDir: apps/frontend

    buildCommand: npm install && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_VERSION
        value: "20"
      # Add NEXT_PUBLIC_API_URL for your backend API (set in Render dashboard)
      # - key: NEXT_PUBLIC_API_URL
      #   sync: false
